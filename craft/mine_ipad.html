<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hanzi Crafter · iPad · 诗仙密码</title>
    <style>
        :root {
            --mc-green: #5aa742;
            --mc-green-light: #7bc962;
            --mc-dirt: #795548;
            --mc-dark: #1a1a1a;
            --mc-panel: #c6c6c6;
            --mc-border-dark: #373737;
            --mc-gray: #8b8b8b;
            --lava: #ff6600;
            --gold: #ffaa00;
            --sidebar-w: 280px;
            --right-w: 240px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--mc-dark);
            color: #f1f1f1;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── TOP BAR ── */
        .topbar {
            background: #1a1a1a;
            border-bottom: 3px solid var(--mc-green);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            height: 62px;
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .topbar-title img {
            height: 42px;
        }

        .game-name {
            font-size: 1.6em;
            font-weight: bold;
            color: var(--mc-green);
            text-shadow: 2px 2px #000;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.75em;
            color: #888;
            letter-spacing: 1px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .timer-widget {
            background: #2a2a2a;
            border: 3px solid var(--mc-green);
            border-top-color: #8bcc72;
            border-left-color: #8bcc72;
            padding: 6px 16px;
            text-align: center;
        }

        .timer-label {
            font-size: 9px;
            color: var(--mc-green);
            letter-spacing: 2px;
        }

        .timer-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
        }

        /* ── MAIN LAYOUT ── */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── LEFT SIDEBAR: UNITS ── */
        .sidebar-left {
            width: var(--sidebar-w);
            background: #252525;
            border-right: 3px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .panel-title {
            padding: 10px 14px;
            font-size: 10px;
            color: var(--mc-green);
            letter-spacing: 2px;
            background: #1e1e1e;
            border-bottom: 2px solid #333;
        }

        .unit-list {
            overflow-y: auto;
            flex: 1;
            padding: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--mc-green) #222;
        }

        .unit-item {
            background: #3a3a3a;
            border: 2px solid #555;
            border-top-color: #666;
            border-left-color: #666;
            padding: 10px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: 0.12s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .unit-item:active { transform: scale(0.98); }

        .unit-item.selected {
            background: #1e3d1e;
            border-color: var(--mc-green);
        }

        .unit-base-char {
            font-size: 28px;
            color: var(--gold);
            text-shadow: 1px 1px #000;
        }

        .unit-meta {
            flex: 1;
        }

        .unit-key {
            font-size: 11px;
            color: #ccc;
        }

        .unit-count {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
        }

        /* ── CENTER: GAME BOARD ── */
        .center {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #game-board {
            flex: 1;
            background: #5c5c5c;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        .board-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        #part-base {
            position: absolute;
            font-size: 180px;
            color: #fff;
            text-shadow: 4px 4px #000;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            user-select: none;
            z-index: 2;
            transition: transform 0.15s;
        }

        #part-base.pulse {
            animation: basePulse 0.3s ease;
        }

        @keyframes basePulse {
            0%   { transform: translate(-50%, -50%) scale(1); }
            50%  { transform: translate(-50%, -50%) scale(1.06); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .placed-radical {
            position: absolute;
            font-size: 100px;
            color: var(--gold);
            text-shadow: 3px 3px #000;
            user-select: none;
            z-index: 3;
            cursor: pointer;
            padding: 6px;
            border: 3px solid transparent;
            border-radius: 2px;
            transition: border-color 0.15s;
        }

        .placed-radical.selected-placed {
            border-color: #fff;
            background: rgba(255,255,255,0.1);
        }

        /* ── BOARD BOTTOM BAR ── */
        .board-bar {
            background: #2a2a2a;
            border-top: 3px solid #444;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .result-box {
            background: var(--mc-gray);
            border: 3px solid var(--mc-border-dark);
            border-bottom-color: #fff;
            border-right-color: #fff;
            width: 68px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            color: #fff;
            text-shadow: 2px 2px #000;
            flex-shrink: 0;
        }

        .result-info {
            flex: 1;
        }

        .result-label-sm {
            font-size: 9px;
            color: #888;
            letter-spacing: 2px;
        }

        .result-char-name {
            font-size: 14px;
            color: var(--mc-green-light);
            font-weight: bold;
        }

        .board-actions {
            display: flex;
            gap: 8px;
        }

        .board-btn {
            padding: 10px 16px;
            border: none;
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: opacity 0.1s;
        }

        .board-btn:active { opacity: 0.7; }

        .btn-lava {
            background: #7a1a00;
            color: #ff9944;
            border: 2px solid #aa3300;
        }

        .btn-clear {
            background: #4a4a00;
            color: #ffff55;
            border: 2px solid #777700;
        }

        .btn-restart {
            background: #003a00;
            color: var(--mc-green-light);
            border: 2px solid var(--mc-green);
        }

        /* ── RIGHT SIDEBAR: RADICALS ── */
        .sidebar-right {
            width: var(--right-w);
            background: #252525;
            border-left: 3px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .selected-radical-info {
            padding: 10px 12px;
            background: #1e1e1e;
            border-bottom: 2px solid #333;
            font-size: 11px;
            color: #888;
            min-height: 48px;
            display: flex;
            align-items: center;
        }

        .sel-char-large {
            font-size: 22px;
            color: var(--gold);
            margin-right: 8px;
        }

        .radical-scroll {
            overflow-y: auto;
            flex: 1;
            padding: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--mc-green) #222;
        }

        .radical-card {
            background: #3a3a3a;
            border: 2px solid #555;
            border-top-color: #666;
            border-left-color: #666;
            padding: 12px 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: 0.12s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .radical-card:active { transform: scale(0.97); background: #2a4a2a; }
        .radical-card.tapped {
            background: #1a3a1a;
            border-color: var(--mc-green);
        }

        .rc-char {
            font-size: 38px;
            color: var(--gold);
            text-shadow: 1px 1px #000;
            flex-shrink: 0;
        }

        .rc-info { flex: 1; }
        .rc-pos { font-size: 9px; color: #888; letter-spacing: 1px; }
        .rc-result { font-size: 12px; color: #ccc; margin-top: 3px; }

        /* ── POSITION OVERLAY ── */
        .pos-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        .pos-overlay.visible { display: flex; }

        .pos-modal {
            background: #1e1e1e;
            border: 3px solid var(--mc-green);
            border-top-color: #8bcc72;
            border-left-color: #8bcc72;
            padding: 24px;
            width: 360px;
        }

        .pos-modal-title {
            font-size: 11px;
            color: var(--mc-green);
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 6px;
        }

        .pos-modal-char {
            font-size: 64px;
            color: var(--gold);
            text-align: center;
            text-shadow: 2px 2px #000;
            margin-bottom: 16px;
        }

        .pos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .pos-btn {
            background: #3a3a3a;
            border: 2px solid #555;
            color: #ddd;
            padding: 14px 8px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            transition: 0.1s;
        }

        .pos-btn:active { background: #2a4a2a; border-color: var(--mc-green); }

        .pos-btn.cancel-btn {
            background: #440000;
            color: #ff9944;
            border-color: #880000;
        }

        /* ── DUCKS ── */
        .duck-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px 0;
            border-top: 2px solid #333;
            background: #1e1e1e;
        }

        .character-duck {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rubber-ducky-img { width: 50px; height: auto; }

        .duck-hat {
            position: absolute;
            top: -13px;
            z-index: 2;
            background: #8B5A2B;
            border: 2px solid #3d2511;
            border-radius: 2px;
            padding: 1px 5px 1px 9px;
            min-width: 65px;
            display: flex;
            flex-direction: row-reverse;
            align-items: center;
            justify-content: center;
            animation: mineVibrate 0.2s linear infinite;
        }

        .duck-hat::before {
            content: "⛏️";
            position: absolute;
            right: 4px;
            top: 50%;
            transform-origin: top right;
            font-size: 14px;
            z-index: 3;
            animation: pickSwing 0.4s ease-in-out infinite;
        }

        .duck-hat::after {
            content: "亻";
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 18px;
            color: #f5deb3;
            font-weight: bold;
            margin-right: 2px;
            animation: radicalSwap 48s steps(1, end) infinite;
            animation-delay: var(--duck-delay, 0s);
        }

        .emoji-glow::after {
            font-size: 16px;
            display: inline-block;
            animation:
                emojiSwap 48s steps(1, end) infinite,
                pulseGlow 2s ease-in-out infinite;
            animation-delay: var(--duck-delay, 0s), 0s;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(255,255,255,0.2)); }
            50% { filter: drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 4px #FFF); }
        }
        @keyframes pickSwing {
            0%, 100% { transform: translateY(-50%) rotate(0deg); }
            50% { transform: translateY(-50%) rotate(-35deg); }
        }
        @keyframes mineVibrate {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, 1px); }
        }
        @keyframes radicalSwap {
            0.00%{content:"亻"}4.17%{content:"口"}8.33%{content:"女"}
            12.50%{content:"宀"}16.67%{content:"山"}20.83%{content:"心"}
            25.00%{content:"忄"}29.17%{content:"扌"}33.33%{content:"攵"}
            37.50%{content:"日"}41.67%{content:"月"}45.83%{content:"木"}
            50.00%{content:"氵"}54.17%{content:"犭"}58.33%{content:"石"}
            62.50%{content:"米"}66.67%{content:"艹"}70.83%{content:"讠"}
            75.00%{content:"车"}79.17%{content:"金"}83.33%{content:"雨"}
            87.50%{content:"马"}91.67%{content:"鱼"}95.83%{content:"鸟"}
        }
        @keyframes emojiSwap {
            0.00%{content:"👤"}4.17%{content:"👄"}8.33%{content:"👩"}
            12.50%{content:"🏠"}16.67%{content:"⛰️"}20.83%{content:"❤️"}
            25.00%{content:"❤️"}29.17%{content:"🖐️"}33.33%{content:"👊"}
            37.50%{content:"☀️"}41.67%{content:"🌙"}45.83%{content:"🌲"}
            50.00%{content:"💧"}54.17%{content:"🐕"}58.33%{content:"🪨"}
            62.50%{content:"🍚"}66.67%{content:"🌱"}70.83%{content:"🗣️"}
            75.00%{content:"🚗"}79.17%{content:"👑"}83.33%{content:"🌧️"}
            87.50%{content:"🐎"}91.67%{content:"🐟"}95.83%{content:"🕊️"}
        }

        /* Flash toast */
        .toast {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(90,167,66,0.95);
            color: #fff;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: nowrap;
            border: 2px solid var(--mc-green-light);
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="topbar-title">
        <img src="Li.png" alt="">
        <div>
            <div class="game-name">HANZI CRAFTER</div>
            <div class="subtitle">形声字 · IPAD EDITION</div>
        </div>
    </div>
    <div class="topbar-right">
        <div class="timer-widget">
            <div class="timer-label">⛏ CRAFT TIME</div>
            <div class="timer-value" id="timer-display">00:00</div>
        </div>
    </div>
</div>

<!-- MAIN LAYOUT -->
<div class="main">

    <!-- LEFT: UNIT LIST -->
    <div class="sidebar-left">
        <div class="panel-title">[ UNITS — SELECT BASE ]</div>
        <div class="unit-list" id="unit-list"></div>
        <div class="duck-row" id="duck-row-left"></div>
    </div>

    <!-- CENTER: BOARD + BAR -->
    <div class="center">
        <div id="game-board">
            <div class="board-grid"></div>
            <div id="part-base">肖</div>
            <!-- placed radicals -->
        </div>

        <!-- BOARD BOTTOM BAR -->
        <div class="board-bar">
            <div class="result-box" id="result-char">-</div>
            <div class="result-info">
                <div class="result-label-sm">CRAFTED RESULT</div>
                <div class="result-char-name" id="result-meaning">Select a radical →</div>
            </div>
            <div class="board-actions">
                <button class="board-btn btn-lava" onclick="deleteSelected()">🌋 LAVA</button>
                <button class="board-btn btn-clear" onclick="clearBoard()">💥 CLEAR</button>
                <button class="board-btn btn-restart" onclick="restartTimer()">⏱ RESET</button>
            </div>
        </div>
    </div>

    <!-- RIGHT: RADICAL PICKER -->
    <div class="sidebar-right">
        <div class="panel-title">[ RADICAL INVENTORY ]</div>
        <div class="selected-radical-info" id="selected-radical-info">
            <span>← Pick a unit, then tap a radical</span>
        </div>
        <div class="radical-scroll" id="radical-inventory"></div>
    </div>

</div>

<!-- POSITION SELECTOR OVERLAY -->
<div class="pos-overlay" id="pos-overlay">
    <div class="pos-modal">
        <div class="pos-modal-title">— CHOOSE PLACEMENT POSITION —</div>
        <div class="pos-modal-char" id="pos-modal-char">亻</div>
        <div class="pos-grid">
            <button class="pos-btn" onclick="placeAtPos('top-left')">↖ TOP-LEFT</button>
            <button class="pos-btn" onclick="placeAtPos('top')">⬆ TOP</button>
            <button class="pos-btn" onclick="placeAtPos('top-right')">↗ TOP-RIGHT</button>
            <button class="pos-btn" onclick="placeAtPos('left')">⬅ LEFT</button>
            <button class="pos-btn" onclick="placeAtPos('center')">⊕ CENTER</button>
            <button class="pos-btn" onclick="placeAtPos('right')">➡ RIGHT</button>
            <button class="pos-btn" onclick="placeAtPos('bottom-left')">↙ BTM-LEFT</button>
            <button class="pos-btn" onclick="placeAtPos('bottom')">⬇ BOTTOM</button>
            <button class="pos-btn cancel-btn" onclick="cancelPos()">✕ CANCEL</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

    ]},
    "unit14_xian": { "base": "山", "radicals": [
        { "char": "亻", "pos": "LEFT", "result": "仙 (Immortal)" },
        { "char": "火", "pos": "LEFT", "result": "灿 (Brilliant)" },
        { "char": "氵", "pos": "LEFT", "result": "汕 (Splashing/Shantou)" }
    ]}
};

let selectedUnitKey = 'unit1_xiao';
let pendingRadical = null;
let selectedPlaced = null;
let timerSeconds = 0;
let timerInterval = null;
let timerRunning = false;

const board = document.getElementById('game-board');
const partBase = document.getElementById('part-base');

const posMap = {
    'top-left':   { left: '18%', top: '12%' },
    'top':        { left: '50%', top: '8%'  },
    'top-right':  { left: '78%', top: '12%' },
    'left':       { left: '12%', top: '48%' },
    'center':     { left: '50%', top: '48%' },
    'right':      { left: '82%', top: '48%' },
    'bottom-left':{ left: '18%', top: '76%' },
    'bottom':     { left: '50%', top: '76%' },
};

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 1600);
}

function playTone(freq, type='square', dur=0.1) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.start(); osc.stop(ctx.currentTime + dur);
    } catch(e){}
}

// ── TIMER ──
function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    timerInterval = setInterval(() => {
        timerSeconds++;
        const m = String(Math.floor(timerSeconds/60)).padStart(2,'0');
        const s = String(timerSeconds%60).padStart(2,'0');
        document.getElementById('timer-display').textContent = `${m}:${s}`;
    }, 1000);
}

function restartTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    timerSeconds = 0;
    document.getElementById('timer-display').textContent = '00:00';
    startTimer();
    toast('⏱ TIMER RESET!');
}

// ── UNITS ──
function renderUnits() {
    const ul = document.getElementById('unit-list');
    ul.innerHTML = '';
    Object.entries(gameData).forEach(([key, unit]) => {
        const item = document.createElement('div');
        item.className = 'unit-item' + (key === selectedUnitKey ? ' selected' : '');
        item.innerHTML = `
            <div class="unit-base-char">${unit.base}</div>
            <div class="unit-meta">
                <div class="unit-key">${key.replace(/_/g,' ')}</div>
                <div class="unit-count">${unit.radicals.length} radicals</div>
            </div>
        `;
        item.onclick = () => setSelectedUnit(key);
        ul.appendChild(item);
    });
}

function setSelectedUnit(key) {
    selectedUnitKey = key;
    const unit = gameData[key];
    partBase.textContent = unit.base;
    partBase.classList.add('pulse');
    setTimeout(() => partBase.classList.remove('pulse'), 300);

    document.getElementById('result-char').textContent = unit.base;
    document.getElementById('result-meaning').textContent = 'Base Component';

    renderUnits();
    renderRadicals(key);
    playTone(440, 'sine', 0.15);
    clearBoard(true);
}

function renderRadicals(key) {
    const inv = document.getElementById('radical-inventory');
    inv.innerHTML = '';
    const unit = gameData[key];

    document.getElementById('selected-radical-info').innerHTML =
        `<span>Tap a radical to place it on the board</span>`;

    unit.radicals.forEach(r => {
        const card = document.createElement('div');
        card.className = 'radical-card';
        const [resultChar, ...rest] = r.result.split(' ');
        card.innerHTML = `
            <div class="rc-char">${r.char}</div>
            <div class="rc-info">
                <div class="rc-pos">${r.pos}</div>
                <div class="rc-result">${resultChar} ${rest.join(' ')}</div>
            </div>
        `;
        card.onclick = () => selectRadical(r, card);
        inv.appendChild(card);
    });
}

// ── PLACEMENT ──
function selectRadical(r, card) {
    pendingRadical = r;
    document.querySelectorAll('.radical-card').forEach(c => c.classList.remove('tapped'));
    card.classList.add('tapped');

    document.getElementById('selected-radical-info').innerHTML =
        `<span class="sel-char-large">${r.char}</span><span>Select board position →</span>`;

    document.getElementById('pos-modal-char').textContent = r.char;
    document.getElementById('pos-overlay').classList.add('visible');
    playTone(600, 'square', 0.08);
    startTimer();
}

function placeAtPos(pos) {
    if (!pendingRadical) return;
    const coords = posMap[pos] || { left: '50%', top: '48%' };

    const el = document.createElement('div');
    el.className = 'placed-radical';
    el.textContent = pendingRadical.char;
    el.style.left = coords.left;
    el.style.top = coords.top;
    el.style.transform = 'translate(-50%, -50%)';
    el.dataset.char = pendingRadical.char;
    el.dataset.result = pendingRadical.result;
    el.onclick = () => selectPlaced(el);
    board.appendChild(el);

    const parts = pendingRadical.result.split(' ');
    document.getElementById('result-char').textContent = parts[0];
    document.getElementById('result-meaning').textContent = parts.slice(1).join(' ').replace(/[()]/g,'') || 'Combined';

    playTone(300, 'triangle', 0.2);
    toast(`⛏ PLACED: ${pendingRadical.char} → ${parts[0]}`);
    cancelPos();
}

function cancelPos() {
    document.getElementById('pos-overlay').classList.remove('visible');
    pendingRadical = null;
    document.querySelectorAll('.radical-card').forEach(c => c.classList.remove('tapped'));
}

function selectPlaced(el) {
    if (selectedPlaced) selectedPlaced.classList.remove('selected-placed');
    selectedPlaced = el;
    el.classList.add('selected-placed');
    document.getElementById('selected-radical-info').innerHTML =
        `<span class="sel-char-large">${el.dataset.char}</span><span>Tap LAVA to delete</span>`;
    playTone(500, 'sine', 0.08);
}

function deleteSelected() {
    if (selectedPlaced) {
        selectedPlaced.remove();
        selectedPlaced = null;
        const unit = gameData[selectedUnitKey];
        document.getElementById('result-char').textContent = unit.base;
        document.getElementById('result-meaning').textContent = 'Base Component';
        document.getElementById('selected-radical-info').innerHTML = `<span>Tap a radical to place it</span>`;
        playTone(80, 'sawtooth', 0.3);
        toast('🌋 THROWN IN LAVA!');
    } else {
        toast('⚠ FIRST TAP A RADICAL ON THE BOARD');
    }
}

function clearBoard(silent) {
    board.querySelectorAll('.placed-radical').forEach(el => el.remove());
    selectedPlaced = null;
    const unit = gameData[selectedUnitKey];
    document.getElementById('result-char').textContent = unit.base;
    document.getElementById('result-meaning').textContent = 'Base Component';
    if (!silent) {
        toast('💥 BOARD CLEARED!');
        playTone(120, 'sawtooth', 0.4);
    }
}

// ── DUCKS ──
function renderDucks() {
    const row = document.getElementById('duck-row-left');
    const CYCLE = 48, TOTAL = 24, STEP = CYCLE / TOTAL;
    const indices = Array.from({length: TOTAL}, (_,i) => i);
    for (let i = indices.length-1; i>0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [indices[i],indices[j]] = [indices[j],indices[i]];
    }
    for (let i = 0; i < 4; i++) {
        const delay = -(indices[i] * STEP);
        const duck = document.createElement('div');
        duck.className = 'character-duck';
        duck.innerHTML = `
            <div class="duck-hat emoji-glow" style="--duck-delay:${delay}s"></div>
            <img src="duckie.png" class="rubber-ducky-img" alt="duck">
        `;
        row.appendChild(duck);
    }
}

// ── INIT ──
renderUnits();
renderRadicals(selectedUnitKey);
renderDucks();
startTimer();
</script>
</body>
</html>
